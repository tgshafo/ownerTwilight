<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Киберпанк | Смертников</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Анимированный красный туман -->
    <div class="blood-fog"></div>
    
    <!-- Анимированные красные кресты -->
    <div class="blood-crosses"></div>
    
    <!-- Анимированный фон -->
    <div class="cyber-background"></div>
    
    <!-- Главный контейнер -->
    <main class="container">
        <!-- Аватар и информация -->
        <section class="profile-section">
            <div class="avatar-container">
                <img src="img/avatar.jpg" alt="Смертников" class="avatar" id="avatar">
                <div class="avatar-blood"></div>
                <div class="blood-drip"></div>
            </div>
            
            <div class="profile-info">
                <h1 class="nickname">Александр Смертников</h1>
                <p class="username">@ownerTwilight</p>
                <div class="status">
                    <div class="status-dot"></div>
                    <span class="status-text">ТГШНЫЙ РАЗНОГЛАСИЕ, ИЛЮША ПСИХОПАТОВ</span>
                </div>
                
                <div class="price-text">
                    <div class="price-line">КАСТА ФУЛЛ</div>
                    <div class="price-details">
                        ПРАЙС - ДЕФ МЕСЯЦ 550|3 МЕСЯЦА 1250|6 МЕСЯЦЕВ 1700|1 ГОД 2500|НАВСЕГДА 5К|ДОКС 600
                    </div>
                </div>
            </div>
        </section>

        <!-- Кнопки -->
        <section class="buttons-section">
            <div class="buttons-center">
                <a href="https://t.me/+yuLEBTEKqdU1ZTQ1" class="blood-btn" target="_blank">
                    <div class="btn-content">
                        <i class="fab fa-telegram"></i>
                        <span class="btn-text">МОЙ КАНАЛ</span>
                    </div>
                    <div class="blood-drip-btn"></div>
                    <div class="btn-pulse"></div>
                </a>

                <a href="https://t.me/+PCSL9n5EWTcyYWQ1" class="blood-btn" target="_blank">
                    <div class="btn-content">
                        <i class="fas fa-comments"></i>
                        <span class="btn-text">МОЙ ЧАТ</span>
                    </div>
                    <div class="blood-drip-btn"></div>
                    <div class="btn-pulse"></div>
                </a>
            </div>
        </section>

        <!-- Футер -->
        <footer class="footer">
            <div class="footer-content">
                <p class="copyright">
                    &copy; 2024 КИБЕРПАНК СМЕРТНИКОВ | КРОВЬ И КОД
                </p>
                <div class="tech-stack">
                    <span class="tech-item">HTML5</span>
                    <span class="tech-item">CSS3</span>
                    <span class="tech-item">JavaScript</span>
                    <span class="tech-item">КРОВЬ</span>
                </div>
                <div class="github-link">
                    <a href="https://github.com/tgshafo" target="_blank">
                        <i class="fab fa-github"></i>
                        СМЕРТНИКОВ КОД
                    </a>
                </div>
            </div>
        </footer>
    </main>

    <!-- Аудио для эффектов -->
    <audio id="hover-sound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-sci-fi-horror-alarm-905.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
